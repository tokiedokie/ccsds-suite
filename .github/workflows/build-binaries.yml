name: Build executables

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Determine build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo 'matrix={"include":[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","artifact":"xtce-editor-linux-x86_64","archive":"xtce-editor-linux-x86_64.tar.gz"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","artifact":"xtce-editor-windows-x86_64","archive":"xtce-editor-windows-x86_64.zip"},{"runner":"macos-15","target":"aarch64-apple-darwin","artifact":"xtce-editor-macos-aarch64","archive":"xtce-editor-macos-aarch64.tar.gz"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","artifact":"xtce-editor-linux-x86_64","archive":"xtce-editor-linux-x86_64.tar.gz"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig-dev \
            libssl-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build release executable
        run: cargo build --locked --release --package xtce-editor --target ${{ matrix.target }}

      - name: Package executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/xtce-editor" dist/package/xtce-editor
          tar -C dist/package -czf "dist/${{ matrix.archive }}" xtce-editor

      - name: Package executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/package" | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/xtce-editor.exe" `
            "dist/package/xtce-editor.exe"
          Compress-Archive `
            -Path "dist/package/xtce-editor.exe" `
            -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach executables to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
